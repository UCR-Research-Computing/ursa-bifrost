[project]
name = "ursa-agent"
version = "0.4.1"
description = "Ursa Major dashboard + Gemini agent: read-only cluster panels, chat, A2A; cluster tools via bifrost MCP as the signed-in user"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.11,<3",
    "a2a-sdk>=1.2,<2",
    "litellm>=1.103,<2",
    "mcp>=1.20,<2",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "cryptography>=44",
    "uvicorn>=0.34",
    "starlette>=0.46",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ursa_agent"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
