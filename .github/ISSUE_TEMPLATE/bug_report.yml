name: Bug report
description: Something did not work, or a diagnosis was wrong
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: bifrost version
      description: Output of `bifrost version`, or the hosted server's /health
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How you ran it
      options: [CLI, MCP stdio (local), Hosted server, ursa-agent dashboard]
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client (if any)
      placeholder: Claude Code 2.x, Codex 0.160, Hermes, OpenCode, Gemini CLI, script...
  - type: textarea
    id: what
    attributes:
      label: What you did and what happened
      description: The command or tool call, and the output (`--json` helps). Remove usernames and anything private.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
