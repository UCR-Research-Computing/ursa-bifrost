# Example config for the hosted server (`bifrost serve`). Mounted on Cloud Run
# at /config/config.yaml from Secret Manager (it holds no secrets itself; the
# secrets come from environment variables named below).
cluster: ursa-major
backend: iap
iap:
  project: ucr-ursa-major-hpc-cluster
  zone: us-central1-a
  instance: ucrslurmcl-slurm-login-001
  host_keys:
    # from /etc/ssh/ssh_host_*_key.pub on the login node
    - "ssh-ed25519 AAAA..."
catalog_path: /apps/docs/catalog.json
log_roots: ["/home/{user}/", "/scratch/{user}/"]
show_cost: true
audit_path: "-"            # stdout -> Cloud Logging
jobs_root: bifrost-jobs
env_check_partition: check  # env_check runs a one-core job here (never on the login node)
caps:
  max_nodes: 4
  max_hours: 24
  max_cost_usd_per_job: 25
  max_cost_usd_per_day: 50
  max_submits_per_day: 20
  confirm_ttl_minutes: 10
staging:                          # file uploads and download links (SPEC 18); omit to turn off
  bucket: <project>-bifrost-staging
  upload_minutes: 15
  link_minutes: 60
  max_upload_bytes: 5368709120     # 5 GiB per file
  max_user_bytes: 21474836480      # 20 GiB staged per person
  max_link_bytes: 2147483648       # 2 GiB per results_link call
  retain_days: 7                   # must match the bucket's delete rule
limits:
  log_lines: 1000
server:
  base_url: https://bifrost-mcp-XXXX.us-central1.run.app
  data_dir: /data                 # Cloud Storage volume (sealed records only)
  users_file: /users/users.yaml   # Secret Manager volume
  google_client_id: XXXX.apps.googleusercontent.com
  google_client_secret_env: BIFROST_GOOGLE_CLIENT_SECRET
  secret_key_env: BIFROST_SECRET_KEY
  access_token_minutes: 60
